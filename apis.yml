name: Debitura
description: >-
  Debitura is an API-first international debt collection platform covering cross-border B2B and B2C
  receivables. It publishes three separate public REST APIs, one per role in the network rather than
  one API with role-gated endpoints: the Customer API for creditors uploading invoices to collection
  and tracking cases, the Referral Partner API for platforms embedding collection as a referral and
  tracking revenue share, and the Collection Partner API for collection agencies operating cases on
  the platform. All three are OpenAPI 3.0.4, each on its own host, and each authenticates with an
  API key in the XApiKey header; the Customer API additionally accepts a bearer token, and the
  Referral Partner API exposes OAuth operations for minting them. Webhooks appear in all three, each
  with a paired test surface for exercising events before going live. Debitura publishes its own
  APIs.json at docs.debitura.com, which is how this profile was built.
url: https://raw.githubusercontent.com/api-evangelist/debitura/refs/heads/main/apis.yml
