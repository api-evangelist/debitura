        url: openapi/debitura-customer-api.json
      - type: OpenAPI
        url: https://docs.debitura.com/openapi/customer-api.json
      - type: Documentation
        url: https://docs.debitura.com/clients
      - type: SignUp
        url: https://app.debitura.com/CreditorApiKey
  - name: Debitura Referral Partner API
    description: >-
      For platforms embedding collection as a referral. Setting up clients, previewing cases,
      tracking revenue share, and minting bearer tokens through OAuth operations. 22 operations
      across 17 paths, OpenAPI 3.0.4 with 81 component schemas. Authenticates with an API key in
      the XApiKey header.
    humanURL: https://docs.debitura.com/referral-partners
    baseURL: https://referral-api.debitura.com
    tags:
      - Debt Collection
      - Debt Recovery
      - FinTech
      - Webhooks
    properties:
      - type: OpenAPI
        url: openapi/debitura-referral-partner-api.json
      - type: OpenAPI
        url: https://docs.debitura.com/openapi/referral-partner-api.json
      - type: Documentation
        url: https://docs.debitura.com/referral-partners
  - name: Debitura Collection Partner API
    description: >-
      For collection agencies operating cases on the platform. Managed cases, bulk ingestion jobs,
      and the user and webhook surface behind them. 48 operations across 38 paths, OpenAPI 3.0.4
      with 68 component schemas. Authenticates with an API key in the XApiKey header.
    humanURL: https://docs.debitura.com/collection-partners
    baseURL: https://collectionpartner-api.debitura.com
    tags:
      - Debt Collection
      - Debt Recovery
