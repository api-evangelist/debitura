apis:
  - name: Debitura Customer API
    description: >-
      For creditors. Uploading B2B and B2C invoices to collection, then tracking cases, contracts,
      payments and tasks through recovery. 53 operations across 44 paths, OpenAPI 3.0.4 with 81
      component schemas. Authenticates with an API key in the XApiKey header or a bearer token.
      Carries webhooks with a paired test-webhook and test-case surface.
    humanURL: https://docs.debitura.com/clients
    baseURL: https://customer-api.debitura.com
