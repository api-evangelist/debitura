x-evidence:
  source: https://docs.debitura.com/apis.json
  source_specification_version: '0.20'
  harvested: '2026-08-01'
  request: api-evangelist/api-evangelist-network#1
  probes:
    - https://docs.debitura.com/apis.json -> HTTP 200 (2026-08-01)
    - https://docs.debitura.com/openapi/customer-api.json -> HTTP 200, 44 paths / 53 ops / 81 schemas
    - https://docs.debitura.com/openapi/referral-partner-api.json -> HTTP 200, 17 paths / 22 ops / 81 schemas
    - https://docs.debitura.com/openapi/collection-partner-api.json -> HTTP 200, 38 paths / 48 ops / 68 schemas
  note: >-
    Built from the provider's own published APIs.json. Every API, documentation URL, OpenAPI URL and
    the signup link come from that document; operation, path and schema counts were measured from
    the fetched specs. Pricing, plans and rate limits are not asserted — nothing published was found
    to support them, so they are left for the enrichment pipeline rather than guessed.
x-refine-exempt:
  reason: >-
    NOT split one-per-tag. Debitura ships three APIs on three different hosts that share tag names
    (Cases, Webhooks, Me, Users, Coverage). refine-openapis merges a shared tag across source specs
    into one document, which collapses the three hosts into whichever server it processed last — the
    merged Cases document carried 31 operations from all three APIs under a single
    collectionpartner-api server, so two thirds of them pointed at a host that does not serve them.
    The specs are registered whole, exactly as Debitura publishes them, until the splitter can carry
    per-operation servers. See api-evangelist/roadmap#6.
