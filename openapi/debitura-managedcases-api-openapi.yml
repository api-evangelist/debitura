          - string
          - 'null'
          description: The type of business error (e.g., "MissingDebtCollectionContract", "MissingPowerOfAttorney", "NoPartnerAvailable").
        message:
          type:
          - string
          - 'null'
          description: A human-readable description of the error.
        solutionUrl:
          type:
          - string
          - 'null'
          description: "A URL where the user can resolve this <i>specific</i> error (e.g., sign a contract).\n            \n\nPartners who want a <b>single URL</b> that walks the user through every pending\nsigning in one chain — instead of forwarding one URL per\n`BusinessErrorApiDTO` — should use\nDebitura.Web.ExternalApi.Contracts.V1.Cases.BusinessErrorResponseApiDTO.SigningHandoff's `CombinedSigningUrl`.\nThe two are complementary: `SolutionUrl` is granular per-error;\n`CombinedSigningUrl` is the chain-walking alternative for signing-related errors."
      additionalProperties: false
      description: Represents a business error in the API response.
    Debitura.Web.ExternalApi.Contracts.V1.Payments.UpdatePaymentRequest:
      required:
      - date
      - paymentAmount
      - paymentRecipient
      type: object
      properties:
        date:
          type: string
          description: Payment date (when payment was received). Provide date only without time component.
          format: date-time
          example: '2025-11-19'
        paymentAmount:
          maximum: 1.7976931348623157e+308
          minimum: 0.01
          type: number
          description: "Total payment amount received.\n            \nWhen both PayoutCreditor and PayoutCollectionPartner are supplied they must sum to this amount.\nWhen both are omitted, the split is computed server-side from the case's pricing terms."
          format: double
          example: 5000.0
        payoutCreditor:
          maximum: 1.7976931348623157e+308
          minimum: 0
          type:
          - number
          - 'null'
          description: "Amount to be paid out to creditor. **Optional.**\n            \nWhen omitted (along with PayoutCollectionPartner), the split is computed server-side from the\ncase's pricing terms (success fee). When supplied, PayoutCollectionPartner must also be supplied\nand the two must sum to PaymentAmount."
          format: double
          example: 4000.0
        payoutCollectionPartner:
          maximum: 1.7976931348623157e+308
          minimum: 0
          type:
          - number
          - 'null'
          description: "Amount to be kept by collection partner (commission). **Optional.**\n            \nWhen omitted (along with PayoutCreditor), the split is computed server-side from the\ncase's pricing terms (success fee). When supplied, PayoutCreditor must also be supplied\nand the two must sum to PaymentAmount."
          format: double
          example: 1000.0
        paymentRecipient:
          minLength: 1
          type: string
          description: "Who received the payment.\n            \n**Valid values:**\n- **Creditor**: Payment was received by the creditor (client). When used, you must also specify CommissionPaymentStatus.\n- **CollectionPartner**: Payment was received by the collection partner. Commission is automatically marked as paid."
          example: Creditor
        commissionPaymentStatus:
          type:
          - string
          - 'null'
          description: "Commission payment status. **Required only if PaymentRecipient is Creditor.**\n            \nWhen PaymentRecipient is CollectionPartner, this field is ignored and commission is automatically marked as Paid.\n            \n**Valid values:** Paid, Unpaid."
          example: Paid
        reopenCaseIfNeeded:
          type: boolean
          description: "Consent to reopen the case if this edit lowers the payment so a previously closed (Paid)\ncase is left with a positive outstanding balance.\n            \nWhen the edit would reopen the case and this flag is `false` (default), the request is\nrejected with HTTP 409 Conflict. Resend with `true` to confirm the reopen — the case is\nreopened to Active and a `case.updated` webhook fires."
          example: false
      additionalProperties: false
      description: "Request to edit an existing payment on a case. Mirrors the payout-split semantics of\nDebitura.Web.ExternalApi.Contracts.V1.Payments.CreatePaymentRequest.\n            \n**Currency:** A payment's currency cannot be changed — it is fixed to the case currency.\n            \n**Invoiced payments are frozen:** a payment whose payout has already been invoiced\n(Stripe/QBO) cannot be edited and returns HTTP 422."
    Debitura.Web.ExternalApi.Contracts.V1.Cases.Requests.CreateManagedCaseRequest:
      required:
      - amountToRecover
      - creditorCompanyName
      - currencyCode
      - date
      - debtor
      type: object
      properties:
        creditorCompanyName:
          minLength: 1
          type: string
          description: 'Creditor company name for this case.

            If you''re submitting cases on behalf of your clients, use your client''s company name.

            If you''re submitting your own cases, use your own partner company name.'
          example: Acme Services Inc
        creditorCountryAlpha2:
          type:
          - string
          - 'null'
          description: Creditor country code (ISO 3166-1 alpha-2 format). Either this or CreditorCountry is required.
          example: US
        creditorCountry:
          type:
          - string
          - 'null'
          description: Creditor country name. Either this or CreditorCountryAlpha2 is required.
          example: United States
        currencyCode:
          minLength: 1
          type: string
          description: Currency code for the case (ISO 4217 format)
          example: USD
        date:
          type: string
          description: Invoice issue date. Provide date only without time component.
          format: date-time
          example: '2024-08-19'
        dueDate:
          type:
          - string
          - 'null'
          description: Invoice due date. Provide date only without time component.
          format: date-time
          example: '2024-09-02'
        comments:
          maxLength: 4000
          type:
          - string
          - 'null'
          description: Optional comments about the case. Use this to provide context about payment attempts, communication history, or other relevant information.
          example: Invoice 2024-INV-1234 for custom ERP system development. Payment 90 days overdue despite multiple reminders. Client confirmed services received but cited cash flow issues.
        claimDescription:
          maxLength: 4000
          type:
          - string
          - 'null'
          description: Client provided description of the services or goods delivered
          example: Software development services - Project Alpha
        creditorReference:
          maxLength: 50
          type:
          - string
          - 'null'
          description: Client's internal reference for the case (e.g., invoice number)
          example: INV-2024-1234
        debtor:
          $ref: '#/components/schemas/Debitura.Web.ExternalApi.Contracts.V1.Cases.DebtorDto'
        amountToRecover:
          type: number
          description: Total amount to recover from debtor (in the specified currency)
          format: double
          example: 15000.0
        isTest:
          type: boolean
          description: 'When true, creates a test case that IS persisted to the database but marked as test data.

            Test cases are excluded from production metrics and can be easily filtered or deleted.

            Use this for integration testing and development.'
        tag:
          maxLength: 100
          type:
          - string
          - 'null'
          description: 'Optional tag for scoped test data grouping (e.g. "suite-run-{uuid}").

            Use this to group test cases created by a single CI pipeline run so they can be

            bulk-deleted via DELETE /test/cases?tag={tag} without affecting parallel runs.

            Only meaningful when IsTest is true. Max 100 characters.'
        collectionPartnerId:
          type:
          - string
          - 'null'
          description: 'Optional: Specify a collection partner ID to handle this case.

            When provided, this partner will be used regardless of lead agent matching rules.

            The partner must be active and have coverage for the debtor''s jurisdiction.'
          format: uuid
      additionalProperties: false
      description: 'Request model for creating a case as a managing partner.

        The partner submits both creditor information and case details in a single request.'
      example:
        creditorCompanyName: Acme Services Inc
        creditorCountry: United States
        currencyCode: USD
        amountToRecover: 15000
        date: '2026-04-22'
        dueDate: '2026-05-06'
        claimDescription: Software development services - Project Alpha
        comments: Invoice INV-2024-1234 for custom ERP system development. Payment 90 days overdue despite multiple reminders. Client confirmed services received but cited cash flow issues.
        creditorReference: INV-2024-1234
        isTest: false
        debtor:
          type: Company
          name: Pacific Trading LLC
          contactPerson: John Smith
          companyRegistrationNumber: 47-1234567
          address: 123 Market Street, Suite 400
          zipCode: '94105'
          city: San Francisco
          stateAlpha2: CA
          country: United States
          email: accounts@pacifictrading.com
          phone: +1 415 555 0123
    Debitura.Web.ExternalApi.Contracts.V1.Cases.DebtorDto:
      required:
      - name
      - type
      type: object
      properties:
        type:
          minLength: 1
          type: string
          description: 'Debtor type. Valid values: "Company" or "Person"'
          example: Company
        name:
          minLength: 1
          type: string
          description: Debtor name (company name or person's full name)
          example: Pacific Trading LLC
        contactPerson:
          type:
          - string
          - 'null'
          description: Contact person at the company (required for companies, not used for persons)
          example: John Smith
        companyRegistrationNumber:
          type:
          - string
          - 'null'
          description: Company registration number (VAT number, CVR, org number, etc.)
          example: 47-1234567
        address:
          type:
          - string
          - 'null'
          description: Street address
          example: 123 Market Street, Suite 400
        zipCode:
          type:
          - string
          - 'null'
          description: Postal/ZIP code
          example: '94105'
        city:
          type:
          - string
          - 'null'
          description: City name
          example: San Francisco
        state:
          type:
          - string
          - 'null'
          description: State/region/province name
          example: California
        stateAlpha2:
          type:
          - string
          - 'null'
          description: 'US state: two-letter code (e.g., "CA"), ISO 3166-2 format (e.g., "US-CA"), or full name (e.g., "California")'
          example: CA
        countryAlpha2:
          type:
          - string
          - 'null'
          description: Country code (ISO 3166-1 alpha-2 format)
          example: US
        country:
          type:
          - string
          - 'null'
          description: Country name
          example: United States
        email:
          type:
          - string
          - 'null'
          description: Email address for debtor contact
          example: accounts@pacifictrading.com
        phone:
          type:
          - string
          - 'null'
          description: Phone number (include country code)
          example: +1 415 555 0123
      additionalProperties: false
      description: 'V1 Debtor DTO for external partner APIs.

        The debtor is the party that owes the debt.'
    Debitura.Web.ExternalApi.Contracts.V1.Cases.InvoiceDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        dateCreated:
          type: string
          format: date-time
        dateUpdated:
          type:
          - string
          - 'null'
          format: date-time
        reference:
          type:
