          type: integer
          format: int32
        onboardingPending:
          type: integer
          format: int32
        totalCases:
          type: integer
          format: int32
      additionalProperties: false
    Debitura.Web.ReferralPartnerApi.Models.Clients.CaseCreationFailure:
      type: object
      properties:
        caseIndex:
          type: integer
          description: Zero-based index of the failed case in the original Cases array.
          format: int32
        creditorReference:
          type:
          - string
          - 'null'
          description: 'Creditor reference from the failed case, if provided.

            Helps consumers identify which specific case failed.'
        errorType:
          type:
          - string
          - 'null'
          description: "Machine-readable error type code for programmatic error handling.\nEnables API consumers to handle different failure scenarios without parsing error messages.\n            \n\n<b>Possible values:</b><list type=\"bullet\"><item><term>Debitura.Web.ReferralPartnerApi.Models.Clients.CaseCreationErrorTypes.NoPartnerAvailable</term><description>No collection partner available for the debtor's jurisdiction.\nThe debtor is in a country/region where Debitura does not yet have collection partner coverage.\nConsider resubmitting with debtors in supported jurisdictions.</description></item><item><term>Debitura.Web.ReferralPartnerApi.Models.Clients.CaseCreationErrorTypes.ValidationError</term><description>The request failed field-level validation.\nCheck the Debitura.Web.ReferralPartnerApi.Models.Clients.CaseCreationFailure.ValidationErrors property for detailed field-specific errors.\nCommon causes: missing required fields, invalid formats, business rule violations.</description></item><item><term>Debitura.Web.ReferralPartnerApi.Models.Clients.CaseCreationErrorTypes.DuplicateReference</term><description>The provided CreditorReference already exists for this creditor or is duplicated in the current request.\nCreditorReference must be unique per creditor.</description></item><item><term>Debitura.Web.ReferralPartnerApi.Models.Clients.CaseCreationErrorTypes.IdempotencyViolation</term><description>The client has already been created in a previous API call.\nCases are not created on repeated calls to maintain idempotency.\nThis is informational - the original operation already succeeded.</description></item><item><term>Debitura.Web.ReferralPartnerApi.Models.Clients.CaseCreationErrorTypes.UnexpectedError</term><description>An unexpected system error occurred during case creation.\nThis is a catch-all for errors not covered by other types.\nContact Debitura support if this error persists.</description></item></list>\nNull if the error type cannot be determined or is not applicable."
        errorMessage:
          type:
          - string
          - 'null'
          description: High-level error message explaining why the case creation failed.
        validationErrors:
          type:
          - object
          - 'null'
          additionalProperties:
            type: array
            items:
              type: string
          description: 'Detailed field-level validation errors if the failure was due to validation.

            Null if the failure was due to other reasons (e.g., no partner match).'
        signingHandoff:
          $ref: '#/components/schemas/Debitura.Web.ExternalApi.Contracts.V1.Cases.SigningHandoffDto'
      additionalProperties: false
      description: Represents a failed case creation attempt during multi-case client creation.
    Debitura.Web.ReferralPartnerApi.Models.Clients.GetClientsResponse:
      type: object
      properties:
        page:
          $ref: '#/components/schemas/Debitura.Domain.Model.Base.PageData'
        summary:
          $ref: '#/components/schemas/Debitura.Web.ReferralPartnerApi.Models.Clients.ClientsSummary'
        clients:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Debitura.Web.ReferralPartnerApi.Models.Clients.ClientCreatedResponse'
          description: List of linked clients
      additionalProperties: false
      description: Response model for listing clients linked to a referral partner
    Debitura.Web.ExternalApi.Contracts.V1.Cases.SigningHandoffDto:
      type: object
      properties:
        combinedSigningUrl:
          type:
          - string
          - 'null'
          description: 'Single signing entry URL that walks the creditor through every

            pending step (SDCA upgrade → PoA → JPA → KYC) on the Creditors app

            and returns to the partner-supplied returnUrl when done.'
      additionalProperties: false
      description: "Partner-facing handoff metadata for a creditor's pending signing chain.\nReturned on POST /cases responses (422 with pending-signing errors,\nor 200 with AllowPendingContracts=true when signings remain).\n            \nDesigned as an envelope so future fields (expiration, suggested email\ncopy, etc.) can be added without polluting the parent DTO."
    Debitura.Web.ExternalApi.Contracts.V1.Cases.CollectionPartnerDto:
      type: object
      properties:
        name:
          type:
          - string
          - 'null'
        officeEmail:
          type:
          - string
          - 'null'
        officePhone:
          type:
          - string
          - 'null'
        publicSite:
          type:
          - string
          - 'null'
        surveyCadenceMode:
          $ref: '#/components/schemas/Debitura.Domain.Model.CollectionPartnerLogics.CollectionPartners.SurveyCadenceMode'
      additionalProperties: false
      description: V1 Collection Partner DTO for external partner APIs
    Debitura.Domain.Model.Creditors.CreditorKycVerifications.CreditorKycVerificationStatus:
      enum:
      - Processing
      - Completed
      type: string
      description: "Partner/staff-settable review status for a Debitura.Domain.Model.Creditors.CreditorKycVerifications.CreditorKycVerification record.\nDistinct from the ReferralPartnerApi `KycStatus` enum, which describes\nwhether a client has submitted KYC data at all — this enum describes whether data that has\nalready been submitted has since been reviewed by the collection partner or Debitura staff.\n            \nThe unset/not-yet-reviewed state is represented by a null\nDebitura.Domain.Model.Creditors.CreditorKycVerifications.CreditorKycVerification.VerificationStatus column, not a third enum value here.\nA fresh KYC resubmission (a new row via `CreditorKycVerificationService.CreateAsync`)\nnaturally leaves this column unset, resetting review status by design.\n            \nWire format is locked to named string values (\"Processing\", \"Completed\") via Newtonsoft.Json\nStringEnumConverter — every host this enum is exposed on (CollectionPartnerApi, CoreApi,\nReferralPartnerApi) uses Newtonsoft (AddNewtonsoftJson in Program.cs), so a System.Text.Json\nJsonStringEnumConverter attribute alone would be silently ignored; both are declared so\nSTJ-based consumers (and our own tests) can also deserialize the string form."
    Debitura.Web.ExternalApi.Contracts.V1.Cases.AssignedUserDto:
      type: object
      properties:
        email:
          type:
          - string
          - 'null'
          description: The assigned user's email address.
        name:
          type:
          - string
          - 'null'
          description: The assigned user's full name.
      additionalProperties: false
      description: Represents the creditor team member assigned to a case.
    Debitura.Web.ExternalApi.Contracts.V1.Cases.Requests.CreateCollectionCaseRequestApiViewModel:
      required:
      - currencyCode
      type: object
      properties:
        currencyCode:
          type:
          - string
          - 'null'
        date:
          type: string
          format: date-time
        dueDate:
          type:
          - string
          - 'null'
          format: date-time
        comments:
          maxLength: 4000
          type:
          - string
          - 'null'
          description: Optional comments about the case, e.g. payment history or communication context.
        claimDescription:
          maxLength: 4000
          type:
          - string
          - 'null'
          description: Client provided description of the claim
        creditorReference:
          maxLength: 50
          type:
          - string
          - 'null'
        debtor:
          $ref: '#/components/schemas/Debitura.Web.ExternalApi.Contracts.V1.Cases.DebtorDto'
        creditorDivisionId:
          type:
          - string
          - 'null'
          format: uuid
        amountToRecover:
          type: number
          description: "The TOTAL amount to recover for this case.\nThis represents the full principal amount across all invoices (if multiple invoices are bundled).\n            \nFor multi-invoice cases with different ages, you can optionally provide age breakdown fields\n(AmountToRecoverOver12Months and AmountToRecoverOver24Months) to enable blended age-based pricing.\n            \nIf age breakdown fields are omitted, age uplift will be calculated from the invoice due date (single-invoice pricing)."
          format: double
        amountToRecoverOver6Months:
          type:
          - number
          - 'null'
          description: "OPTIONAL - MULTI-INVOICE AGE BUCKET PRICING (PRICING ZONE 180-DAY THRESHOLD)\n            \nThe portion of AmountToRecover that is more than 6 months (180 days) overdue.\nThis includes amounts that are 12+ and 24+ months overdue.\n            \nThis field is optional and can only be provided alongside AmountToRecoverOver12Months\nand AmountToRecoverOver24Months. It enables precise pricing tier selection based on\nthe 180-day threshold. When omitted, the system falls back to deriving the threshold\nfrom AmountToRecoverOver12Months.\n            \nValidation rules:\n- Must be ≤ AmountToRecover\n- Must be ≥ AmountToRecoverOver12Months"
          format: double
        amountToRecoverOver12Months:
          type:
          - number
          - 'null'
          description: "OPTIONAL - MULTI-INVOICE AGE BUCKET PRICING\n            \nThe portion of AmountToRecover that is more than 12 months overdue.\nThis includes amounts that are 24+ months overdue.\n            \nIf provided, AmountToRecoverOver24Months must also be provided.\nBoth fields must be provided together or both omitted.\n            \nUsed to calculate blended age uplift for multi-invoice cases:\n- Amount under 12 months = AmountToRecover - AmountToRecoverOver12Months\n- Amount 12-24 months = AmountToRecoverOver12Months - AmountToRecoverOver24Months\n- Amount over 24 months = AmountToRecoverOver24Months\n            \nBlended uplift formula: ((A12-A24)×10 + A24×20) / AmountToRecover\nwhere A12 = AmountToRecoverOver12Months, A24 = AmountToRecoverOver24Months\n            \nValidation rules:\n- Must be ≤ AmountToRecover\n- Must be ≥ AmountToRecoverOver24Months"
          format: double
        amountToRecoverOver24Months:
          type:
          - number
          - 'null'
          description: "OPTIONAL - MULTI-INVOICE AGE BUCKET PRICING\n            \nThe portion of AmountToRecover that is more than 24 months overdue.\n            \nIf provided, AmountToRecoverOver12Months must also be provided.\nBoth fields must be provided together or both omitted.\n            \nUsed to calculate blended age uplift for multi-invoice cases.\nSee AmountToRecoverOver12Months for full details on the calculation.\n            \nValidation rules:\n- Must be ≤ AmountToRecoverOver12Months\n- Must be ≤ AmountToRecover"
          format: double
        skipDebituraVerification:
          type: boolean
          description: This skips the 'Pending verification' for Debitura and puts case straight to partner
        skipCreationEmails:
          type: boolean
          description: 'Deprecated — this field is accepted for backwards compatibility but is ignored server-side.

            Creation emails are always suppressed; the hourly CasesStarted digest is the single

            notification channel for all entry points.'
          deprecated: true
        allowPendingContracts:
          type: boolean
          description: 'When true, cases with unsigned contracts (SDCA/POA) are accepted in ''PendingContractSigning''

            status instead of being rejected with 422. The case transitions automatically once contracts are signed.

            Default: false (unsigned contracts return 422).'
        isTest:
          type: boolean
          description: 'When true, creates a test case that IS persisted to the database but marked as test data.

            Test cases are excluded from production metrics and can be easily filtered or deleted.

            Use this for integration testing and development.'
        tag:
          maxLength: 100
          type:
          - string
          - 'null'
          description: 'Optional tag for scoped test data grouping (e.g. "suite-run-{uuid}").

            Use this to group test cases created by a single CI pipeline run so they can be

            bulk-deleted via DELETE /test/cases?tag={tag} without affecting parallel runs.

            Only meaningful when IsTest is true. Max 100 characters.'
        collectionPartnerId:
          type:
          - string
          - 'null'
          description: 'Optional: Specify a collection partner ID to handle this case.

            When provided, this partner will be used regardless of lead agent matching rules.

            The partner must be active and have coverage for the debtor''s jurisdiction.'
          format: uuid
        assignedUserEmail:
          maxLength: 320
          type:
          - string
          - 'null'
          description: 'Optional: Email address of the creditor team member to assign as the case owner.

            When provided, email notifications for this case will be sent only to this user

            instead of all team members.

            Must correspond to an active member of your team.'
          format: email
          example: john.doe@example.com
        returnUrl:
          maxLength: 2048
          type:
          - string
          - 'null'
          description: "Optional: URL the creditor user should land on after completing any\npending signing chain (SDCA upgrade / PoA / JPA / KYC) on the\nDebitura Creditors app. Embedded, URL-encoded, into\n`BusinessErrorResponseApiDTO.SigningHandoff.CombinedSigningUrl`\n(on 422 with pending signings) and\n`InvoiceDto.SigningHandoff.CombinedSigningUrl` (on 200 when\n`AllowPendingContracts=true` with signings remaining).\n            \nMust be an absolute http(s) URL. Values that fail validation\n(relative URLs, non-http schemes, header-injection characters) are\nsilently dropped — the combined URL is still emitted but without\nthe returnUrl query parameter, and the Creditors app falls back to\nits own safe in-app default landing.\n            \nAdditive. Existing integrations\nthat omit this field see the same behaviour as before."
      additionalProperties: false
    Debitura.Web.ReferralPartnerApi.Models.Clients.KycVerificationDto:
      type: object
      properties:
        directorFullName:
          type:
          - string
          - 'null'
        directorHomeAddress:
          type:
          - string
          - 'null'
        directorDateOfBirth:
          type: string
          format: date
        dateCreated:
          type: string
          format: date-time
        verificationStatus:
          $ref: '#/components/schemas/Debitura.Domain.Model.Creditors.CreditorKycVerifications.CreditorKycVerificationStatus'
        verificationStatusUpdatedAt:
          type:
          - string
          - 'null'
          description: When Debitura.Web.ReferralPartnerApi.Models.Clients.KycVerificationDto.VerificationStatus was last set. Null until set.
          format: date-time
      additionalProperties: false
    Debitura.Web.ExternalApi.Contracts.V1.Cases.CreditorDivisionDto:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the division
          format: uuid
        name:
          type:
          - string
          - 'null'
          description: Name of the division
      additionalProperties: false
      description: 'Creditor division information for external partner APIs.

        Represents a specific division or department within a creditor organization.'
    Debitura.Web.ReferralPartnerApi.Models.Clients.CreateClientRequest:
      required:
      - client
      - externalTenantId
      - users
      type: object
      properties:
        externalTenantId:
          minLength: 1
          type: string
        client:
          $ref: '#/components/schemas/Debitura.Web.ReferralPartnerApi.Models.Clients.ClientDetailsDto'
        users:
          minItems: 1
          type: array
          items:
            $ref: '#/components/schemas/Debitura.Web.ReferralPartnerApi.Models.Clients.ClientUserDto'
        cases:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Debitura.Web.ExternalApi.Contracts.V1.Cases.Requests.CreateCollectionCaseRequestApiViewModel'
          description: 'Optional: Cases to create alongside the client.

            If provided, cases will be created with PendingContractSigning status.

            The onboarding URL will guide the client through contract signing for all required PoAs.

            Supports multi-invoice age bucket pricing fields (AmountToRecoverOver6Months, AmountToRecoverOver12Months, AmountToRecoverOver24Months).'
      additionalProperties: false
      example:
        externalTenantId: tenant-12345
        client:
          name: Acme Corp
          registrationNumber: '12345678'
          address: 123 Business Street
          zipCode: '1000'
          city: Lisbon
          state: Lisbon
          country: Portugal
          supportEmail: billing@acme-corp.com
          supportPhone: +351 123 456 789
        users:
        - name: John Doe
          email: john.doe@acme-corp.com
          isOnboardingUser: true
        cases:
        - currencyCode: EUR
          amountToRecover: 4000
          date: '2026-02-22'
          dueDate: '2026-03-02'
          claimDescription: Custom mobile app development services
          comments: Outstanding invoice INV 2024 00789 for custom mobile app development delivered 15 Nov 2024; payment 60 days overdue despite two reminders.
          creditorReference: INV‑2024‑00789
          isTest: false
          debtor:
            type: Company
            name: Acme Corp
            contactPerson: John Doe
            companyRegistrationNumber: '12345678'
            address: 123 Business Street
            zipCode: '1000'
            city: Lisbon
            state: Lisbon
            countryAlpha2: PT
            email: billing@acme‑corp.com
            phone: +351 123 456 789
    Debitura.Web.ExternalApi.Contracts.V1.Errors.ApiErrorResponseDto:
      type: object
      properties:
        error:
          type:
          - string
          - 'null'
          description: Short human-readable error label (legacy field — preserved for backward compatibility).
        message:
          type:
          - string
          - 'null'
          description: Human-readable error description (legacy field — preserved for backward compatibility).
        businessErrors:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Debitura.Web.ExternalApi.Contracts.V1.Cases.BusinessErrorApiDTO'
          description: Canonical structured error array. Consumers should migrate to reading this field.
      additionalProperties: false
      description: "Generic structured error response for API endpoints.\n            \nDual-write design: existing fields (Debitura.Web.ExternalApi.Contracts.V1.Errors.ApiErrorResponseDto.Error / Debitura.Web.ExternalApi.Contracts.V1.Errors.ApiErrorResponseDto.Message etc.)\nare preserved for backward compatibility alongside the canonical\nDebitura.Web.ExternalApi.Contracts.V1.Errors.ApiErrorResponseDto.BusinessErrors array, allowing consumers to migrate at their own pace."
    Debitura.Web.ReferralPartnerApi.Models.Clients.ClientUserDto:
      required:
      - email
      - name
      type: object
      properties:
        name:
          minLength: 1
          type: string
        email:
          minLength: 1
          type: string
          format: email
        isOnboardingUser:
          type: boolean
          description: 'Marks this user as the one going through onboarding.

            Defaults to false. Exactly ONE user must have this set to true.'
