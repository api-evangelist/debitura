    Debitura.Web.ReferralPartnerApi.Models.Clients.KycStatus:
      enum:
      - NotRequired
      - Pending
      - Verified
      type: string
      description: "KYC (Know Your Customer) verification status for a client linked to a referral partner.\nCaptures three distinct states that a simple boolean cannot express.\n            \nWire format is LOCKED to snake_case string values (\"not_required\", \"pending\", \"verified\")\nvia Newtonsoft.Json StringEnumConverter with SnakeCaseNamingStrategy. The host serializer\nfor this API is Newtonsoft.Json (AddNewtonsoftJson in Program.cs), so a System.Text.Json\nJsonStringEnumConverter attribute would be silently ignored — hence the explicit Newtonsoft\nconverter here.\n            \nThe System.Text.Json JsonConverter attribute is declared in addition so that consumers\n(and our own integration tests) who parse responses using System.Text.Json can deserialize\nthe string form back into this enum. The Newtonsoft converter is what actually controls\noutbound wire format on this host."
    Debitura.Web.ExternalApi.Contracts.V1.Cases.BusinessErrorApiDTO:
      type: object
      properties:
        type:
          type:
          - string
          - 'null'
          description: The type of business error (e.g., "MissingDebtCollectionContract", "MissingPowerOfAttorney", "NoPartnerAvailable").
        message:
          type:
          - string
          - 'null'
          description: A human-readable description of the error.
        solutionUrl:
          type:
          - string
          - 'null'
          description: "A URL where the user can resolve this <i>specific</i> error (e.g., sign a contract).\n            \n\nPartners who want a <b>single URL</b> that walks the user through every pending\nsigning in one chain — instead of forwarding one URL per\n`BusinessErrorApiDTO` — should use\nDebitura.Web.ExternalApi.Contracts.V1.Cases.BusinessErrorResponseApiDTO.SigningHandoff's `CombinedSigningUrl`.\nThe two are complementary: `SolutionUrl` is granular per-error;\n`CombinedSigningUrl` is the chain-walking alternative for signing-related errors."
      additionalProperties: false
      description: Represents a business error in the API response.
    Debitura.Web.ReferralPartnerApi.Models.Clients.ConflictResponse:
      type: object
      properties:
        type:
          type:
          - string
          - 'null'
          description: The type of conflict that occurred
        message:
          type:
          - string
          - 'null'
          description: Human-readable description of the conflict
        data:
          description: 'Additional payload for the conflict. Shape depends on Debitura.Web.ReferralPartnerApi.Models.Clients.ConflictResponse.Type:

            <list type="bullet"><item><description>`ClientExistsNeedsLinking` → Debitura.Web.ReferralPartnerApi.Models.Clients.ClientExistsNeedsLinkingResponse (ExternalTenantId + OnboardingLinks.Url only — never contains PII).</description></item><item><description>`ClientAlreadyLinkedToAnotherPartner` → Debitura.Web.ReferralPartnerApi.Models.Clients.ClientAlreadyLinkedResponse (ExternalTenantId only — never contains PII).</description></item><item><description>Other conflict types may omit this field entirely.</description></item></list>'
      additionalProperties: false
      description: Response returned when a conflict occurs during client creation
    Debitura.Web.ReferralPartnerApi.Models.Clients.ClientDeletableResponse:
      type: object
      properties:
        isDeletable:
          type: boolean
          description: True if the client can be safely deleted.
        blockers:
          type:
          - array
          - 'null'
          items:
            type: string
          description: List of reasons why the client cannot be deleted (empty if IsDeletable is true).
      additionalProperties: false
      description: Response indicating whether a client can be deleted.
    Debitura.Web.ExternalApi.Contracts.V1.Cases.DebtorDto:
      required:
      - name
      - type
      type: object
      properties:
        type:
          minLength: 1
          type: string
          description: 'Debtor type. Valid values: "Company" or "Person"'
          example: Company
        name:
          minLength: 1
          type: string
          description: Debtor name (company name or person's full name)
          example: Pacific Trading LLC
        contactPerson:
          type:
          - string
          - 'null'
          description: Contact person at the company (required for companies, not used for persons)
          example: John Smith
        companyRegistrationNumber:
          type:
          - string
          - 'null'
          description: Company registration number (VAT number, CVR, org number, etc.)
          example: 47-1234567
        address:
          type:
          - string
          - 'null'
          description: Street address
          example: 123 Market Street, Suite 400
        zipCode:
          type:
          - string
          - 'null'
          description: Postal/ZIP code
          example: '94105'
        city:
          type:
          - string
          - 'null'
          description: City name
          example: San Francisco
        state:
          type:
          - string
          - 'null'
          description: State/region/province name
          example: California
        stateAlpha2:
          type:
          - string
          - 'null'
          description: 'US state: two-letter code (e.g., "CA"), ISO 3166-2 format (e.g., "US-CA"), or full name (e.g., "California")'
          example: CA
        countryAlpha2:
          type:
          - string
          - 'null'
          description: Country code (ISO 3166-1 alpha-2 format)
          example: US
        country:
          type:
          - string
          - 'null'
          description: Country name
          example: United States
        email:
          type:
          - string
          - 'null'
          description: Email address for debtor contact
          example: accounts@pacifictrading.com
        phone:
          type:
          - string
          - 'null'
          description: Phone number (include country code)
          example: +1 415 555 0123
      additionalProperties: false
