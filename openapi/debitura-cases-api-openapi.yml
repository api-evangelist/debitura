components:
  schemas:
    Debitura.Web.ExternalApi.Contracts.V1.Users.UserRelationDto:
      required:
      - email
      type: object
      properties:
        id:
          type: integer
          format: int32
        dateCreated:
          type:
          - string
          - 'null'
          format: date-time
        dateUpdated:
          type:
          - string
          - 'null'
          format: date-time
        firstName:
          type:
          - string
          - 'null'
        lastName:
          type:
          - string
          - 'null'
        email:
          type:
          - string
          - 'null'
      additionalProperties: false
    Debitura.Web.ExternalApi.Contracts.V1.Cases.ExclusivePeriodDto:
      type: object
      properties:
        engagementStartDate:
          type: string
          description: Start date of the initial exclusivity engagement.
          format: date-time
        currentEndDate:
          type: string
          description: Current end date of the exclusive period (after any extensions).
          format: date-time
        daysRemaining:
          type: integer
          description: 'Days remaining until the period ends. Negative when the period has naturally expired.

            Zero when the engagement was terminated early (partner change or withdrawal),

            regardless of the original end date.'
          format: int32
        status:
          type:
          - string
          - 'null'
          description: 'Current status of the exclusive period: Active, Expired, or Terminated.

            Active — partner has exclusive rights.

            Expired — period ended naturally (time elapsed or case resolved).

            Terminated — period was ended early (partner change, withdrawal, etc.).'
        extensions:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Debitura.Web.ExternalApi.Contracts.V1.Cases.ExclusivePeriodExtensionDto'
          description: 'Each extension event that occurred within the current engagement, in chronological order.

            Empty for cases that have never had an extension triggered.'
      additionalProperties: false
      description: 'Full exclusive collection period chain for a case.

        Returned by GET /cases/{id}/exclusive-period.'
    Debitura.Web.ExternalApi.Contracts.V1.Cases.TimelineActorDto:
      required:
      - type
      type: object
      properties:
        type:
          type:
          - string
          - 'null'
          description: 'The type of actor. One of: "System", "Creditor user", "Partner user".'
        name:
          type:
          - string
          - 'null'
          description: Display name of the actor, if available.
      additionalProperties: false
      description: Represents the actor (person or system) that performed a timeline action.
    Debitura.Web.ExternalApi.Contracts.V1.Cases.PriceChangeConfirmationResponse:
      type: object
      properties:
        caseId:
          type: string
          description: The case ID.
          format: uuid
        confirmationRequired:
          type: boolean
          description: 'Always `true` on this response. Lets clients branch on the response shape without

            inspecting the HTTP status code.'
        isIntentionalRate:
          type: boolean
          description: 'True when the rate is a deliberately-set rate (accepted quote or manual override) rather than a plain

            bracket crossing. When true the client resolves the 409 with `KeepIntentionalRate = true` only

            (the rate is preserve-only; `ConfirmPriceChange = true` is rejected with 400). When false only

            `ConfirmPriceChange = true` applies (re-price). Lets the consumer branch without parsing

            Debitura.Web.ExternalApi.Contracts.V1.Cases.PriceChangeConfirmationResponse.Message.'
        currentSuccessFee:
          type:
          - number
          - 'null'
          description: The success fee percentage currently on the case (before the edit).
          format: double
        proposedSuccessFee:
          type: number
          description: The success fee percentage that would apply if the edit is confirmed.
          format: double
        warning:
          type:
          - string
          - 'null'
          description: 'Optional warning surfaced alongside the confirmation — e.g. when the principal is lowered on a

            case that already has payments (partner-rules.md suggests registering a payment instead).

            Null when there is no warning.'
        message:
          type:
          - string
          - 'null'
          description: Human-readable explanation of why confirmation is required.
      additionalProperties: false
      description: 'Returned with HTTP 409 when a principal edit would move the case success fee by more than the

        allowed threshold (>0.1 percentage points), or would affect a deliberately-set rate. The edit is

        NOT applied; the partner reviews the proposed rate change and resubmits the same request to resolve it.

        For a plain bracket crossing (Debitura.Web.ExternalApi.Contracts.V1.Cases.PriceChangeConfirmationResponse.IsIntentionalRate false) resubmit with

        `ConfirmPriceChange = true` to re-price. For a deliberately-set rate (Debitura.Web.ExternalApi.Contracts.V1.Cases.PriceChangeConfirmationResponse.IsIntentionalRate

        true) the rate is preserve-only: resubmit with `KeepIntentionalRate = true` to apply the edit and

        keep it — partners cannot override it, and sending `ConfirmPriceChange = true` on such a case is

        rejected with HTTP 400 (DEB-4765 (b)). See partner-rules.md (price-change confirmation) and DEB-4759.'
    Debitura.Domain.Model.CommunicationCenter.Chats.ChatRole:
      enum:
      - 0
      - 1
      - 2
      type: integer
      format: int32
    Debitura.Web.ExternalApi.Contracts.V1.Files.CaseFileDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        dateCreated:
          type: string
          format: date-time
        dateUpdated:
          type: string
          format: date-time
        caseId:
          type: string
          format: uuid
        entityType:
          type:
          - string
          - 'null'
        entityId:
          type: string
          format: uuid
        fileName:
          type:
          - string
          - 'null'
        url:
          type:
          - string
          - 'null'
        description:
          type:
          - string
          - 'null'
        documentType:
          type:
          - string
          - 'null'
      additionalProperties: false
    Debitura.Web.ExternalApi.Contracts.V1.Cases.Requests.CloseCaseRequest:
      required:
      - closeCode
      type: object
      properties:
        closeCode:
          minLength: 1
          type: string
          description: "Close code/reason for closing the case.\n            \n**Valid close codes:**\n- **Paid**: Full payment received from debtor\n- **PartiallyPaid**: Some payment received but not full amount\n- **DebtorInsolventBankrupt**: Debtor declared bankruptcy or insolvent\n- **DebtorUntraceable**: Unable to locate or contact debtor\n- **DisputedLegalActionDeclinedByClient**: Debt disputed, creditor declined legal action\n- **WithdrawnByClient**: Creditor requested case withdrawal\n- **PreLegalExhaustedNoPayment**: All pre-legal attempts exhausted without payment\n- **StatuteOfLimitationsExpired**: Legal time limit to collect has passed\n- **SettlementRejectedByClient**: Proposed settlement rejected by creditor\n- **UnresponsiveClient**: Creditor not responding to collection partner\n- **UneconomicalToPursue**: Recovery cost exceeds claim value\n- **Other**: Other reason (please provide comment)"
          example: Paid
        comment:
          maxLength: 2000
          minLength: 0
          type:
          - string
          - 'null'
          description: Optional comment explaining the closure (recommended for 'Other' close code)
          example: Case closed after full payment received via bank transfer on 2025-11-19
      additionalProperties: false
      description: Request to close a case
    Debitura.Web.ExternalApi.Contracts.V1.Cases.ClosedByDto:
      required:
      - userName
      type: object
      properties:
        userId:
          type: integer
          format: int32
        userName:
          type:
          - string
          - 'null'
      additionalProperties: false
    Debitura.Web.ExternalApi.Contracts.V1.Cases.SigningHandoffDto:
      type: object
      properties:
        combinedSigningUrl:
          type:
          - string
          - 'null'
          description: 'Single signing entry URL that walks the creditor through every

            pending step (SDCA upgrade → PoA → JPA → KYC) on the Creditors app

            and returns to the partner-supplied returnUrl when done.'
      additionalProperties: false
      description: "Partner-facing handoff metadata for a creditor's pending signing chain.\nReturned on POST /cases responses (422 with pending-signing errors,\nor 200 with AllowPendingContracts=true when signings remain).\n            \nDesigned as an envelope so future fields (expiration, suggested email\ncopy, etc.) can be added without polluting the parent DTO."
    Debitura.Web.ExternalApi.Contracts.V1.Cases.CollectionPartnerDto:
      type: object
      properties:
        name:
          type:
          - string
          - 'null'
        officeEmail:
          type:
          - string
          - 'null'
        officePhone:
          type:
          - string
          - 'null'
        publicSite:
          type:
          - string
          - 'null'
        surveyCadenceMode:
          $ref: '#/components/schemas/Debitura.Domain.Model.CollectionPartnerLogics.CollectionPartners.SurveyCadenceMode'
      additionalProperties: false
      description: V1 Collection Partner DTO for external partner APIs
    Debitura.Web.ExternalApi.Contracts.V1.Payments.CreatePaymentResponse:
      required:
      - caseReference
      - commissionPaymentStatus
      - paymentRecipient
      type: object
      properties:
        paymentId:
          type: string
          format: uuid
        caseReference:
          type:
          - string
          - 'null'
        date:
          type: string
          format: date-time
        paymentAmount:
          type: number
          format: double
        payoutCreditor:
          type: number
          format: double
        payoutCollectionPartner:
          type: number
          format: double
        paymentRecipient:
          type:
          - string
          - 'null'
        commissionPaymentStatus:
          type:
          - string
          - 'null'
        closeCase:
          type: boolean
        caseClosed:
          type: boolean
        closeCode:
          type:
          - string
          - 'null'
        remainingAmount:
          type: number
          format: double
        warnings:
          type:
          - array
          - 'null'
          items:
            type: string
          description: 'Non-blocking warnings about this payment. Always present (empty when there is nothing to flag).

            Currently populated only when an explicit PayoutCreditor/PayoutCollectionPartner override was

            supplied and (a) it allocates zero to the creditor, or (b) the case already had no outstanding

            balance before this payment — both are signs of a misconfigured or duplicate payment. The

            payment is still recorded; these are advisory only, not errors. Review and resolve out of band

            if unexpected (e.g. via the case''s Payments view in the Partner Portal, or by contacting

            Debitura support).'
      additionalProperties: false
      description: Response after creating a payment
    Debitura.Web.ExternalApi.Contracts.V1.Payments.PaymentRelatedInvoiceDto:
      required:
      - reference
      - status
      type: object
      properties:
        status:
          type:
          - string
          - 'null'
        reference:
          type:
          - string
          - 'null'
        invoiceId:
          type: string
          format: uuid
      additionalProperties: false
    Debitura.Web.ExternalApi.Contracts.V1.Cases.AssignedUserDto:
      type: object
      properties:
        email:
          type:
          - string
          - 'null'
          description: The assigned user's email address.
        name:
          type:
          - string
          - 'null'
          description: The assigned user's full name.
      additionalProperties: false
      description: Represents the creditor team member assigned to a case.
    Debitura.Web.ExternalApi.Contracts.V1.Cases.Requests.UpdateCaseFeesRequest:
      type: object
      properties:
        grossAmount:
          maximum: 1.7976931348623157e+308
          minimum: 0
          type:
          - number
          - 'null'
          description: 'Principal claim amount (gross amount) in the case currency.

            Optional — omit to leave the principal unchanged (fees-only update, backward-compatible).

            Both increases and decreases are allowed; must be ≥ 0.'
          format: double
          example: 1000.0
        interestFees:
          maximum: 1.7976931348623157e+308
          minimum: 0
          type: number
          description: Interest fees on this case, in the case currency.
          format: double
          example: 25.5
        reminderFees:
          maximum: 1.7976931348623157e+308
          minimum: 0
          type: number
          description: Reminder fees on this case, in the case currency.
          format: double
          example: 10.0
        collectionFees:
          maximum: 1.7976931348623157e+308
          minimum: 0
          type: number
          description: Collection fees on this case, in the case currency.
          format: double
          example: 50.0
        confirmPriceChange:
          type: boolean
          description: "The \"Change to standard\" resolution. When a principal edit on a <em>standard-rate</em> case would\nmove the success fee by more than 0.1 percentage points (a bracket crossing), the first request\nreturns HTTP 409 with the proposed old/new rate instead of applying the change. Resubmit the same\nrequest with this set to `true` to confirm and apply the re-price. Leaving it `false`\n(the default) on an unaffected edit has no effect. See partner-rules.md (price change confirmation\nrequired if the success fee changes by >0.1%).\n            \nIMPORTANT (DEB-4765 (b)): on a case with a deliberately-set rate (an accepted quote or a manual\noverride), partners can never override a special agreement via this API. Sending this flag on such a\ncase is REJECTED with HTTP 400 — resubmit with Debitura.Web.ExternalApi.Contracts.V1.Cases.Requests.UpdateCaseFeesRequest.KeepIntentionalRate=`true` to apply\nthe edit and keep the special rate. Only the admin (internal) surface can change a special rate."
          example: false
        keepIntentionalRate:
          type: boolean
          description: 'The "Keep special rate" resolution. When the case carries a deliberately-set rate (an accepted

            quote or a manual override) that the edit would otherwise prompt about, resubmit with this set to

            `true` to apply the edit while preserving the existing rate. On this external Partner API a

            special rate is preserve-only: this is the ONLY way to apply an edit to such a case — sending

            Debitura.Web.ExternalApi.Contracts.V1.Cases.Requests.UpdateCaseFeesRequest.ConfirmPriceChange instead is rejected with HTTP 400. Ignored for a plain bracket

            crossing on a non-intentional rate (use Debitura.Web.ExternalApi.Contracts.V1.Cases.Requests.UpdateCaseFeesRequest.ConfirmPriceChange there).'
          example: false
      additionalProperties: false
      description: Request to update the fee amounts (and optionally the principal) on an active case.
    Debitura.Web.ExternalApi.Contracts.V1.Notes.CreateNoteRequest:
      required:
      - description
      type: object
      properties:
        description:
          maxLength: 10000
          minLength: 0
          type: string
          description: Note content
          example: Called debtor on 2025-11-19. They acknowledged the debt and promised to pay within 7 days. Will follow up on 2025-11-26.
        eventDate:
          type:
          - string
          - 'null'
          description: 'The date when the event actually occurred. Must not be in the future.

            When provided, the note will appear at this date in the timeline instead of the upload time.

            This is useful for importing historical events (e.g. a phone call that happened last week).

            Omit or set to null to use the current time (default behaviour).'
          format: date-time
          example: '2025-11-14T09:30:00Z'
      additionalProperties: false
      description: Request to create a new note on a case
    Debitura.Web.ExternalApi.Contracts.V1.Notes.NoteDto:
      required:
      - caseReference
      - title
      - visibility
      type: object
      properties:
        id:
          type: string
          format: uuid
        caseReference:
          type:
          - string
          - 'null'
        title:
          type:
          - string
          - 'null'
        description:
          type:
          - string
          - 'null'
        visibility:
          type:
          - string
          - 'null'
        createdAt:
          type: string
          format: date-time
        eventDate:
          type:
          - string
          - 'null'
          description: 'The event date provided at creation time. Null if no EventDate was supplied,

            meaning the note was recorded in real-time (CreatedAt reflects the actual event time).'
          format: date-time
        createdBy:
          $ref: '#/components/schemas/Debitura.Web.ExternalApi.Contracts.V1.Notes.NoteCreatedByDto'
      additionalProperties: false
      description: Note details response
    Debitura.Web.ExternalApi.Contracts.V1.Cases.CreditorDivisionDto:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the division
          format: uuid
        name:
          type:
          - string
          - 'null'
          description: Name of the division
      additionalProperties: false
      description: 'Creditor division information for external partner APIs.

        Represents a specific division or department within a creditor organization.'
    Debitura.Web.ExternalApi.Contracts.V1.Errors.ApiErrorResponseDto:
      type: object
      properties:
        error:
          type:
          - string
          - 'null'
          description: Short human-readable error label (legacy field — preserved for backward compatibility).
        message:
          type:
          - string
          - 'null'
          description: Human-readable error description (legacy field — preserved for backward compatibility).
        businessErrors:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Debitura.Web.ExternalApi.Contracts.V1.Cases.BusinessErrorApiDTO'
          description: Canonical structured error array. Consumers should migrate to reading this field.
      additionalProperties: false
      description: "Generic structured error response for API endpoints.\n            \nDual-write design: existing fields (Debitura.Web.ExternalApi.Contracts.V1.Errors.ApiErrorResponseDto.Error / Debitura.Web.ExternalApi.Contracts.V1.Errors.ApiErrorResponseDto.Message etc.)\nare preserved for backward compatibility alongside the canonical\nDebitura.Web.ExternalApi.Contracts.V1.Errors.ApiErrorResponseDto.BusinessErrors array, allowing consumers to migrate at their own pace."
    Debitura.Web.ExternalApi.Contracts.V1.Cases.BankAccountDto:
      type: object
      properties:
        id:
          type: integer
          description: Bank account identifier
          format: int32
        label:
          type:
          - string
          - 'null'
          description: User-friendly label (e.g., "Main EUR Account")
        scheme:
          type:
          - string
          - 'null'
          description: 'Account scheme: IBAN, SWIFT, or LOCAL'
        currencyCode:
          type:
          - string
          - 'null'
          description: Currency code (ISO 4217)
        bankCountryCode:
          type:
          - string
          - 'null'
          description: Bank country code (ISO Alpha-2)
        accountHolderName:
          type:
          - string
          - 'null'
          description: Account holder name (beneficiary)
        iban:
          type:
          - string
          - 'null'
          description: IBAN (for IBAN scheme accounts)
        bic:
          type:
          - string
          - 'null'
          description: BIC/SWIFT code (for IBAN and SWIFT scheme accounts)
        accountNumber:
          type:
          - string
          - 'null'
          description: Account number (for SWIFT and LOCAL scheme accounts)
        localIdentifier:
          type:
          - string
          - 'null'
          description: Local identifier (for LOCAL scheme accounts, e.g., sort code + account number)
        localIdentifierType:
          type:
          - string
          - 'null'
          description: Type of local identifier (e.g., "Sort Code", "Routing Number")
        bankName:
          type:
          - string
          - 'null'
          description: Bank name (optional)
        bankAddress:
          type:
          - string
          - 'null'
          description: Bank address (optional)
        bankCity:
          type:
          - string
          - 'null'
          description: Bank city (optional)
        bankZipCode:
          type:
          - string
          - 'null'
          description: Bank zip/postal code (optional)
        bankState:
          type:
          - string
          - 'null'
          description: Bank state/region (optional)
      additionalProperties: false
      description: 'Bank account information for partner API.

        Full details provided as partners need this to:

        1. Provide payment instructions to debtors (when debtor pays client directly)

        2. Execute payouts to clients (when partner receives payment and pays out remainder)'
    Debitura.Web.ExternalApi.Contracts.V1.Cases.InvoiceAllocationOutstandingDto:
      type: object
      properties:
        principal:
          type: number
          format: double
        interest:
          type: number
          format: double
        reminderFees:
          type: number
          format: double
        collectionFees:
          type: number
          format: double
      additionalProperties: false
      description: 'Additive external-API read model. Per-bucket outstanding on the debt ledger, produced by

        the payment allocation engine (bucket total minus Σ active stored allocations — never re-derived

        from a model). Mirrors the internal

        `Debitura.Domain.Model.Receiveables.InvoiceEconomics.EconomicalAllocationOutstanding` shape.'
    Debitura.Web.ExternalApi.Contracts.V1.Payments.CreatePaymentRequest:
      required:
      - date
      - paymentAmount
      - paymentRecipient
      type: object
      properties:
        date:
          type: string
          description: Payment date (when payment was received). Provide date only without time component.
          format: date-time
          example: '2025-11-19'
        paymentAmount:
          maximum: 1.7976931348623157e+308
          minimum: 0.01
          type: number
          description: "Total payment amount received.\n            \nWhen both PayoutCreditor and PayoutCollectionPartner are supplied they must sum to this amount.\nWhen both are omitted, the split is computed server-side from the case's pricing terms."
          format: double
          example: 5000.0
        payoutCreditor:
          maximum: 1.7976931348623157e+308
          minimum: 0
          type:
          - number
          - 'null'
          description: "Amount to be paid out to creditor. **Optional — omit by default.**\n            \nNormal usage is to leave this (and PayoutCollectionPartner) unset: the split is then computed\nserver-side from the case's pricing terms (success fee), which is correct for almost every\nintegration. Setting this is an **advanced, opt-in override** for legitimate edge cases (e.g. a\nnegotiated split where the collection partner already holds funds) — most callers should never\nneed it. When supplied, PayoutCollectionPartner must also be supplied and the two must sum to\nPaymentAmount. A zero value here (entire payment routed to the partner), or an explicit split\nsupplied on a case that already has no outstanding balance, is accepted but surfaced as a\nwarning in the response (`CreatePaymentResponse.Warnings`) rather than rejected — review\nthese warnings, as they are signs of a misconfigured or duplicate payment."
          format: double
          example: 4000.0
        payoutCollectionPartner:
          maximum: 1.7976931348623157e+308
          minimum: 0
          type:
          - number
          - 'null'
          description: "Amount to be kept by collection partner (commission). **Optional — omit by default.**\n            \nNormal usage is to leave this (and PayoutCreditor) unset: the split is then computed\nserver-side from the case's pricing terms (success fee), which is correct for almost every\nintegration. Setting this is an **advanced, opt-in override** for legitimate edge cases (e.g. a\nnegotiated split where the collection partner already holds funds) — most callers should never\nneed it. When supplied, PayoutCreditor must also be supplied and the two must sum to\nPaymentAmount. See PayoutCreditor (above) for the soft-guard warnings this can trigger."
          format: double
          example: 1000.0
        paymentRecipient:
          minLength: 1
          type: string
          description: "Who received the payment.\n            \n**Valid values:**\n- **Creditor**: Payment was received by the creditor (client). When used, you must also specify CommissionPaymentStatus.\n- **Platform**: Payment was received by Debitura platform. Commission is automatically marked as paid.\n- **CollectionPartner**: Payment was received by the collection partner. Commission is automatically marked as paid."
          example: Creditor
        commissionPaymentStatus:
          type:
          - string
          - 'null'
          description: "Commission payment status. **Required only if PaymentRecipient is Creditor.**\n            \nWhen PaymentRecipient is CollectionPartner or Platform, this field is ignored and commission is automatically marked as Paid.\n            \n**Valid values:**\n- **Paid**: Commission has been paid to collection partner\n- **Unpaid**: Commission has not yet been paid to collection partner"
          example: Paid
        closeCase:
          type: boolean
        createUnpaidCommissionFollowUp:
          type: boolean
          description: "Whether to run the unpaid-commission follow-up chain when this payment leaves the\ncollection partner's commission Unpaid (PaymentRecipient = Creditor, CommissionPaymentStatus = Unpaid).\nThe chain is: stamp the payout reminder date, email the partner, and create the\nUnpaidCommissionInvoiceClient follow-up task — which the reminder robot then drives.\n            \nDefaults to `true`, preserving the standard API / UI behaviour. Set to `false`\nto opt this source out of the entire chain (no stamp, email, task, reminders or escalation);\nthe Payment and Payout are still created normally. Used by ingestion partners (e.g. ASTOP)\nthat already report commission settlement out of band and must not trigger the chase."
          example: true
      additionalProperties: false
